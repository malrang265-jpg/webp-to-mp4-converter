name: Python Linting and Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --no-cache-dir -r requirements.txt
        pip install pylint flake8 black
    
    - name: Lint with pylint
      run: |
        pylint main.py --disable=all --enable=E,F || true
    
    - name: Check code style with flake8
      run: |
        flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Check code formatting with black
      run: |
        black --check main.py || true

  build-executable:
    runs-on: windows-latest
    needs: lint-and-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --no-cache-dir -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name=WebP-to-MP4-Converter main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebP-to-MP4-Converter-Windows
        path: dist/WebP-to-MP4-Converter.exe
